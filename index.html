<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bennyboyblue121's Music</title>

<style>
  :root {
    --bg-color: #ffffff;
    --card-bg: #f5f5f7;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --border-color: #e5e5ea;
    --accent-color: #000000;
    --card-radius: 16px;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
  }

  body.dark {
    --bg-color: #000000;
    --card-bg: #1c1c1e;
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --border-color: #38383a;
    --accent-color: #ffffff;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    background: var(--bg-color);
    border-bottom: 1px solid var(--border-color);
    z-index: 100;
    padding: 15px 0;
    backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--bg-color) 80%, transparent);
  }

  .nav {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* NEW: Logo Styling */
  .site-logo {
    height: 30px;
    width: auto;
    border-radius: 6px; /* Optional: rounds the logo slightly */
  }

  .search {
    flex: 1;
    max-width: 400px;
  }

  .search input {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-size: 0.95rem;
    outline: none;
    transition: box-shadow 0.2s;
  }
  
  .search input:focus {
    box-shadow: 0 0 0 2px var(--border-color);
  }

  .nav-actions {
    display: flex;
    gap: 15px;
  }

  .nav-btn {
    background: transparent;
    border: none;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-primary);
    cursor: pointer;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
  }

  .nav-btn:hover {
    background: var(--card-bg);
  }

  /* =========================
     NEW: CAROUSEL STYLING 
     ========================= */
  .carousel-wrapper {
    max-width: 1200px;
    margin: 40px auto 0;
    padding: 0 20px;
    position: relative;
  }

  .carousel-container {
    overflow: hidden;
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    background: var(--card-bg);
    border: 1px solid var(--border-color);
  }

  .carousel-track {
    display: flex;
    transition: transform 0.5s ease-in-out;
    height: 400px;
  }

  .carousel-slide {
    min-width: 100%;
    position: relative;
    background-size: cover;
    background-position: center;
    padding: 40px;
  }

  /* Dark gradient to ensure text is always readable over pictures */
  .carousel-slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 100%);
    z-index: 1;
  }

  .carousel-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* Pushes title up, text/button down */
  }

  .carousel-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin: 0;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .carousel-bottom {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
    max-width: 600px;
  }

  .carousel-text {
    font-size: 1.2rem;
    margin: 0;
    color: #f5f5f7;
    line-height: 1.4;
    text-shadow: 0 1px 5px rgba(0,0,0,0.5);
  }

  .carousel-action-btn {
    padding: 10px 24px;
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    border-radius: 20px;
    transition: transform 0.2s, background 0.2s;
  }

  .carousel-action-btn:hover {
    background: #e5e5ea;
    transform: scale(1.05);
  }

  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-color);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    font-size: 1.5rem;
    width: 50px;
    height: 50px;
    cursor: pointer;
    z-index: 10;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    transition: background 0.2s;
  }

  .carousel-arrow:hover {
    background: var(--card-bg);
  }

  /* Position arrows outside the box slightly */
  .prev-arrow { left: 0px; }
  .next-arrow { right: 0px; }

  @media (max-width: 768px) {
    .carousel-track { height: 300px; }
    .carousel-title { font-size: 1.8rem; }
    .carousel-text { font-size: 1rem; }
    .prev-arrow { left: 10px; }
    .next-arrow { right: 10px; }
  }


  /* =========================
     ORIGINAL STYLES BELOW
     ========================= */
  .container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
  }

  .filters {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.2s ease;
  }

  .filter-btn:hover {
    border-color: var(--text-secondary);
  }

  .filter-btn.active {
    background: var(--accent-color);
    color: var(--bg-color);
    border-color: var(--accent-color);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
  }

  .track-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
  }

  .track-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .track-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
    color: var(--text-primary);
    line-height: 1.3;
  }

  audio {
    width: 100%;
    height: 40px;
    border-radius: 8px;
  }

  .download-btn {
    display: inline-block;
    padding: 8px 16px;
    background: var(--text-primary);
    color: var(--bg-color);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 8px;
    text-align: center;
    transition: opacity 0.2s;
  }

  .download-btn:hover {
    opacity: 0.8;
  }

  details {
    border-top: 1px solid var(--border-color);
    padding-top: 10px;
  }

  summary {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  summary::-webkit-details-marker {
    display: none;
  }
  
  summary:hover {
    color: var(--text-primary);
  }

  details iframe {
    width: 100%;
    height: 80px;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
  }

  .unavailable {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-style: italic;
    margin-top: 10px;
  }

  footer {
    margin: 60px 0 30px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .settings-overlay {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
    display: none;
    z-index: 200;
  }

  .settings-overlay.show {
    display: block;
  }

  .settings-overlay h4 {
    margin: 0 0 15px;
    font-size: 0.9rem;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-content {
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--card-radius);
    padding: 30px;
    width: 90%;
    max-width: 500px;
    box-shadow: var(--shadow);
    transform: translateY(20px);
    transition: transform 0.3s ease;
  }

  .modal-overlay.show .modal-content {
    transform: translateY(0);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--text-primary);
  }

  .close-btn {
    background: var(--card-bg);
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--text-primary);
    cursor: pointer;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mix-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .mix-item {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--card-bg);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }

  .mix-cover {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--border-color);
  }

  .mix-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .mix-info h3 {
    margin: 0;
    font-size: 1.1rem;
    color: var(--text-primary);
  }

  .untitled-tag {
    margin: 0;
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-style: italic;
  }

  .mix-link {
    display: inline-block;
    margin-top: 5px;
    padding: 6px 12px;
    background: var(--text-primary);
    color: var(--bg-color);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 8px;
    text-align: center;
    align-self: flex-start;
  }

  @media (max-width: 600px) {
    .nav { flex-direction: column; gap: 15px; }
    .search { max-width: 100%; }
  }
</style>
</head>

// --- INITIALIZATION --- //
document.getElementById('instagramBtn').href = SITE_SETTINGS.instagramLink;

// --- BUILD CAROUSEL --- //
const track = document.getElementById('carouselTrack');
let currentSlide = 0;

carouselData.forEach(data => {
  const slide = document.createElement('div');
  slide.className = 'carousel-slide';
  slide.style.backgroundImage = `url('${data.image}')`;
  
  // Conditionally add button if text exists
  let buttonHTML = data.buttonText ? `<a href="${data.link}" class="carousel-action-btn">${data.buttonText}</a>` : '';

  slide.innerHTML = `
    <div class="carousel-content">
      <h2 class="carousel-title">${data.title}</h2>
      <div class="carousel-bottom">
        <p class="carousel-text">${data.text}</p>
        ${buttonHTML}
      </div>
    </div>
  `;
  track.appendChild(slide);
});

const updateCarousel = () => {
  track.style.transform = `translateX(-${currentSlide * 100}%)`;
};

document.getElementById('nextSlide').addEventListener('click', () => {
  currentSlide = (currentSlide + 1) % carouselData.length;
  updateCarousel();
});

document.getElementById('prevSlide').addEventListener('click', () => {
  currentSlide = (currentSlide - 1 + carouselData.length) % carouselData.length;
  updateCarousel();
});

// --- BUILD TRACK GRID --- //
const grid = document.getElementById('trackGrid');

function createTrackCard(track) {
  const card = document.createElement('div');
  card.className = 'track-card';
  card.dataset.title = track.title.toLowerCase();

  let spotifySection = track.spotify 
    ? `<details>
         <summary>Spotify Link</summary>
         <iframe src="${track.spotify}"></iframe>
       </details>`
    : `<div class="unavailable">Not available on streaming platforms</div>`;

  let downloadBtn = SITE_SETTINGS.showDownloadButton 
    ? `<a href="${track.file}" download class="download-btn">Download Audio</a>`
    : ``;

  card.innerHTML = `
    <div class="track-header">
      <h3 class="track-title">${track.title}</h3>
    </div>
    <audio controls preload="none">
      <source src="${track.file}">
      Your browser does not support the audio element.
    </audio>
    ${downloadBtn}
    ${spotifySection}
  `;
  
  return card;
}

musicLibrary.forEach(track => {
  grid.appendChild(createTrackCard(track));
});

// --- INTERACTIVITY --- //
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  document.querySelectorAll('.track-card').forEach(card => {
    card.style.display = card.dataset.title.includes(query) ? 'flex' : 'none';
  });
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  if(btn.id === 'toggleTheme') return;

  btn.addEventListener('click', () => {
    document.querySelectorAll('#filterContainer .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const filterType = btn.dataset.filter;
    document.querySelectorAll('.track-card').forEach(card => {
      const firstChar = card.dataset.title.charAt(0).toLowerCase();
      
      let shouldShow = false;
      if (filterType === 'all') shouldShow = true;
      else if (filterType === 'a-f' && firstChar >= 'a' && firstChar <= 'f') shouldShow = true;
      else if (filterType === 'g-m' && firstChar >= 'g' && firstChar <= 'm') shouldShow = true;
      else if (filterType === 'n-s' && firstChar >= 'n' && firstChar <= 's') shouldShow = true;
      else if (filterType === 't-z' && firstChar >= 't' && firstChar <= 'z') shouldShow = true;

      card.style.display = shouldShow ? 'flex' : 'none';
    });
  });
});

// --- MODAL LOGIC --- //
const mixBtn = document.getElementById('mixBtn');
const mixModal = document.getElementById('mixModal');
const closeMixModal = document.getElementById('closeMixModal');

mixBtn.addEventListener('click', () => {
  mixModal.classList.add('show');
});

closeMixModal.addEventListener('click', () => {
  mixModal.classList.remove('show');
});

mixModal.addEventListener('click', (e) => {
  if (e.target === mixModal) {
    mixModal.classList.remove('show');
  }
});

// --- THEME LOGIC --- //
const settingsPanel = document.getElementById('settingsPanel');
document.getElementById('settingsBtn').onclick = () => settingsPanel.classList.toggle('show');

const toggleThemeBtn = document.getElementById('toggleTheme');

const applyTheme = (theme) => {
  if (theme === 'dark') {
    document.body.classList.add('dark');
  } else {
    document.body.classList.remove('dark');
  }
};

const savedTheme = localStorage.getItem('theme');
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

if (savedTheme) {
  applyTheme(savedTheme);
} else if (systemPrefersDark) {
  applyTheme('dark');
}

toggleThemeBtn.onclick = () => {
  const isCurrentlyDark = document.body.classList.contains('dark');
  const newTheme = isCurrentlyDark ? 'light' : 'dark';
  applyTheme(newTheme);
  localStorage.setItem('theme', newTheme);
};
</script>
