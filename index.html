<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bennyboyblue121's Music</title>

<style>
  :root {
    --bg-color: #ffffff;
    --card-bg: #f5f5f7;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --border-color: #e5e5ea;
    --accent-color: #000000;
    --card-radius: 16px;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
  }

  body.dark {
    --bg-color: #000000;
    --card-bg: #1c1c1e;
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --border-color: #38383a;
    --accent-color: #ffffff;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    background: var(--bg-color);
    border-bottom: 1px solid var(--border-color);
    z-index: 100;
    padding: 15px 0;
    backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--bg-color) 80%, transparent);
  }

  .nav {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .search {
    flex: 1;
    max-width: 400px;
  }

  .search input {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-size: 0.95rem;
    outline: none;
    transition: box-shadow 0.2s;
  }
  
  .search input:focus {
    box-shadow: 0 0 0 2px var(--border-color);
  }

  .nav-actions {
    display: flex;
    gap: 15px;
  }

  .nav-btn {
    background: transparent;
    border: none;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-primary);
    cursor: pointer;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
  }

  .nav-btn:hover {
    background: var(--card-bg);
  }

  .container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
  }

  .filters {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.2s ease;
  }

  .filter-btn:hover {
    border-color: var(--text-secondary);
  }

  .filter-btn.active {
    background: var(--accent-color);
    color: var(--bg-color);
    border-color: var(--accent-color);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
  }

  /* TRACK CARD STYLING */
  .track-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
  }

  .track-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .track-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
    color: var(--text-primary);
    line-height: 1.3;
  }

  audio {
    width: 100%;
    height: 40px;
    border-radius: 8px;
  }

  .download-btn {
    display: inline-block;
    padding: 8px 16px;
    background: var(--text-primary);
    color: var(--bg-color);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 8px;
    text-align: center;
    transition: opacity 0.2s;
  }

  .download-btn:hover {
    opacity: 0.8;
  }

  /* SPOTIFY ACCORDION */
  details {
    border-top: 1px solid var(--border-color);
    padding-top: 10px;
  }

  summary {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  summary::-webkit-details-marker {
    display: none;
  }
  
  summary:hover {
    color: var(--text-primary);
  }

  details iframe {
    width: 100%;
    height: 80px;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
  }

  .unavailable {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-style: italic;
    margin-top: 10px;
  }

  footer {
    margin: 60px 0 30px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  /* SETTINGS OVERLAY */
  .settings-overlay {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
    display: none;
    z-index: 200;
  }

  .settings-overlay.show {
    display: block;
  }

  .settings-overlay h4 {
    margin: 0 0 15px;
    font-size: 0.9rem;
  }

  /* MIX MODAL & BLUR STYLING */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px); /* Adds the background blur */
    -webkit-backdrop-filter: blur(12px);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-content {
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: var(--card-radius);
    padding: 30px;
    width: 90%;
    max-width: 500px;
    box-shadow: var(--shadow);
    transform: translateY(20px);
    transition: transform 0.3s ease;
  }

  .modal-overlay.show .modal-content {
    transform: translateY(0);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--text-primary);
  }

  .close-btn {
    background: var(--card-bg);
    border: none;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--text-primary);
    cursor: pointer;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mix-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .mix-item {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--card-bg);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }

  .mix-cover {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--border-color);
  }

  .mix-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .mix-info h3 {
    margin: 0;
    font-size: 1.1rem;
    color: var(--text-primary);
  }

  .untitled-tag {
    margin: 0;
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-style: italic;
  }

  .mix-link {
    display: inline-block;
    margin-top: 5px;
    padding: 6px 12px;
    background: var(--text-primary);
    color: var(--bg-color);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    border-radius: 8px;
    text-align: center;
    align-self: flex-start;
  }

  @media (max-width: 600px) {
    .nav { flex-direction: column; gap: 15px; }
    .search { max-width: 100%; }
  }
</style>
</head>

<body>
<header>
  <div class="nav">
    <div class="brand">BENNYBOYBLUE121</div>
    <div class="search">
      <input id="searchInput" type="text" placeholder="Search for a track..." />
    </div>
    <div class="nav-actions">
      <button class="nav-btn" id="mixBtn">Bennyboyblue121's Mix</button>
      <button class="nav-btn" id="settingsBtn">Settings</button>
      <a class="nav-btn" id="instagramBtn" target="_blank">Instagram</a>
    </div>
  </div>
</header>

<div class="container">
  <div class="filters" id="filterContainer">
    <button class="filter-btn active" data-filter="all">All Tracks</button>
    <button class="filter-btn" data-filter="a-f">A–F</button>
    <button class="filter-btn" data-filter="g-m">G–M</button>
    <button class="filter-btn" data-filter="n-s">N–S</button>
    <button class="filter-btn" data-filter="t-z">T–Z</button>
  </div>

  <div class="grid" id="trackGrid">
    </div>
</div>

<div class="settings-overlay" id="settingsPanel">
  <h4>Preferences</h4>
  <button class="filter-btn" id="toggleTheme">Toggle Dark Mode</button>
</div>

<div class="modal-overlay" id="mixModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Bennyboyblue121's Mixes</h2>
      <button class="close-btn" id="closeMixModal">&times;</button>
    </div>
    <div class="mix-list">
      
      <div class="mix-item">
        <img src="Img/Bennyboyblue121's Mix/Bennyboyblue121's Mix-artwork.jpg" alt="Mix Cover" class="mix-cover">
        <div class="mix-info">
          <h3>Bennyboyblue121's Mix</h3>
          <p class="untitled-tag">only available on [untitled]</p>
          <a href="https://untitled.stream/library/project/fAAYom5naFnjNz0q1rkdG" class="mix-link" target="_blank">Listen Now</a>
        </div>
      </div>

      <div class="mix-item">
        <img src="Img/Bennyboyblue121's Mix/Bennyboyblue121's Mix 2-artwork.jpg" alt="Mix Cover" class="mix-cover">
        <div class="mix-info">
          <h3>Bennyboyblue121's Mix 2</h3>
          <p class="untitled-tag">only available on [untitled]</p>
          <a href="https://untitled.stream/library/project/EpYRUA5OTFjOWEV4UbHUb" class="mix-link" target="_blank">Listen Now</a>
        </div>
      </div>

    </div>
  </div>
</div>

<footer>© 2026 BENNYBOYBLUE121</footer>

  { title: "GOOD (DON'T DIE)", file: "music/GOOD (DON'T DIE).mp3", spotify: "https://open.spotify.com/embed/episode/0BBQACuLwMNrgFPO5zuort" },

  { title: "Hell of a Life ( V9 )", file: "music/Hell of a Life ( V9 ).mp3", spotify: "https://open.spotify.com/embed/episode/44hpLJ87Is7ld8vmPC04lM" },
  { title: "Bulletproof", file: "music/Bulletproof.mp3", spotify: "https://open.spotify.com/embed/episode/3Cn9VKvu5JMVmimy70Fb2k" },
  { title: "FLOWERS", file: "music/FLOWERS.mp3", spotify: "https://open.spotify.com/embed/episode/3FqcYCZjYjkaSLDi7fzXNl" },
  { title: "The Storm", file: "music/The Storm.mp3", spotify: "https://open.spotify.com/embed/episode/191eemMgxAXegM8mSjwquV" },
  { title: "HOLD TIGHT", file: "music/Hold Tight.mp3", spotify: "https://open.spotify.com/embed/episode/6IiCluNO0Indjc0uKUrlgm" },
  { title: "POWER Remix", file: "music/POWER Remix.mp3", spotify: "https://open.spotify.com/embed/episode/4WefbrYFjTuHViVwtlKW5L" },
  { title: "Can U Be", file: "music/Can U Be.mp3", spotify: "https://open.spotify.com/embed/episode/26WAicJC7UL7yof1wtKa0o" },
  { title: "Christian Dior Denim Flow", file: "music/Christian Dior Denim Flow.mp3", spotify: "https://open.spotify.com/embed/episode/2fzOoVtgFAF4apXCpxN2CQ" },
  { title: "CASH TO BURN", file: "music/Cash to Burn.mp3", spotify: "https://open.spotify.com/embed/episode/0YKtuWKIzK4cseKtdUVFQr" },
  { title: "PABLO", file: "music/PABLO.mp3", spotify: "https://open.spotify.com/embed/episode/11nvKmUA96HtJ1OwSHiXHd" },
  { title: "Lift Yourself (Edit)", file: "music/Lift Yourself (Edit).mp3", spotify: "https://open.spotify.com/embed/episode/17KEpxPWJbbhagL3AlufKD" },
  { title: "All the love", file: "music/All the love.mp3", spotify: "https://open.spotify.com/embed/episode/2vHsxuz3whUg7fpwjIW9AK" },
  { title: "All The Love (Mexico City 2026)", file: "music/All The Love (Mexico City 2026).mp3", spotify: "https://open.spotify.com/embed/episode/4RVXsDS7FUlWaArzIOdhHa" },
  { title: "Stronger (Mexico City 2026)", file: "music/Stronger (Mexico City 2026).mp3", spotify: null },
  { title: "Future Bounce", file: "music/Future Bounce.mp3", spotify: "https://open.spotify.com/embed/episode/5WRoWTZHC4TEYAzlKYoNMH" },
  { title: "Violent Crimes (11 Minute Edit)", file: "music/Violent Crimes (11 Minute Edit).mp3", spotify: "https://open.spotify.com/embed/episode/1tp1a7iE4o4kwNDgBoitLz" },
  { title: "Ice Cube", file: "music/Ice Cube.mp3", spotify: null },
  { title: "EVERYBODY", file: "music/EVERYBODY.mp3", spotify: "https://open.spotify.com/embed/episode/7dIug3G4O48fqDmUXbmNpi" },
  { title: "Armina", file: "music/Armina (Pastelle Collective).mp3", spotify: "https://open.spotify.com/embed/episode/0c9hSeXbYEThDswX33afjP" },
  { title: "All Dreams Real", file: "music/All Dreams Real.mp3", spotify: "https://open.spotify.com/embed/episode/6gZk6jZRMQPybMED9MNS9E" },
  { title: "Never Coming Back", file: "music/Never Coming Back.mp3", spotify: null },
  { title: "SOUNDS", file: "music/Sounds.wav", spotify: "https://open.spotify.com/embed/episode/5Fi3sgjmmmq5HpDivyGNfE" },
  { title: "Brothers", file: "music/Brothers.mp3", spotify: "https://open.spotify.com/embed/episode/5On3LGGWGHuGwBGT9ZRXlB" },
  { title: "Love Love Love", file: "music/Love Love Love.mp3", spotify: "https://open.spotify.com/embed/episode/41UqrHQbgzUt3fEWNkTorI" },
  { title: "TAKE OFF YOUR DRESS", file: "music/TAKE OFF YOUR DRESS.mp3", spotify: "https://open.spotify.com/embed/episode/6W0TmRkfEkK8t9Ad1mCoBf" },
  { title: "Deja Vu", file: "music/Deja Vu.mp3", spotify: "https://open.spotify.com/embed/episode/2ScAoBidb91gjj2Ma7qgRh" },
  { title: "L.A Monster", file: "music/L.A Monster.mp3", spotify: "https://open.spotify.com/embed/episode/0VGlCsSrgwdnZSGlrMk7VZ" }
];

// --- INITIALIZATION --- //
document.getElementById('instagramBtn').href = SITE_SETTINGS.instagramLink;
const grid = document.getElementById('trackGrid');

function createTrackCard(track) {
  const card = document.createElement('div');
  card.className = 'track-card';
  card.dataset.title = track.title.toLowerCase();

  let spotifySection = track.spotify 
    ? `<details>
         <summary>Spotify Link</summary>
         <iframe src="${track.spotify}"></iframe>
       </details>`
    : `<div class="unavailable">Not available on streaming platforms</div>`;

  let downloadBtn = SITE_SETTINGS.showDownloadButton 
    ? `<a href="${track.file}" download class="download-btn">Download Audio</a>`
    : ``;

  card.innerHTML = `
    <div class="track-header">
      <h3 class="track-title">${track.title}</h3>
    </div>
    <audio controls preload="none">
      <source src="${track.file}">
      Your browser does not support the audio element.
    </audio>
    ${downloadBtn}
    ${spotifySection}
  `;
  
  return card;
}

musicLibrary.forEach(track => {
  grid.appendChild(createTrackCard(track));
});

// --- INTERACTIVITY --- //

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  document.querySelectorAll('.track-card').forEach(card => {
    card.style.display = card.dataset.title.includes(query) ? 'flex' : 'none';
  });
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  if(btn.id === 'toggleTheme') return;

  btn.addEventListener('click', () => {
    document.querySelectorAll('#filterContainer .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const filterType = btn.dataset.filter;
    document.querySelectorAll('.track-card').forEach(card => {
      const firstChar = card.dataset.title.charAt(0).toLowerCase();
      
      let shouldShow = false;
      if (filterType === 'all') shouldShow = true;
      else if (filterType === 'a-f' && firstChar >= 'a' && firstChar <= 'f') shouldShow = true;
      else if (filterType === 'g-m' && firstChar >= 'g' && firstChar <= 'm') shouldShow = true;
      else if (filterType === 'n-s' && firstChar >= 'n' && firstChar <= 's') shouldShow = true;
      else if (filterType === 't-z' && firstChar >= 't' && firstChar <= 'z') shouldShow = true;

      card.style.display = shouldShow ? 'flex' : 'none';
    });
  });
});

// --- MODAL LOGIC --- //
const mixBtn = document.getElementById('mixBtn');
const mixModal = document.getElementById('mixModal');
const closeMixModal = document.getElementById('closeMixModal');

// Open modal
mixBtn.addEventListener('click', () => {
  mixModal.classList.add('show');
});

// Close modal when X is clicked
closeMixModal.addEventListener('click', () => {
  mixModal.classList.remove('show');
});

// Close modal when clicking outside the box
mixModal.addEventListener('click', (e) => {
  if (e.target === mixModal) {
    mixModal.classList.remove('show');
  }
});

// --- UPDATED THEME LOGIC --- //
const settingsPanel = document.getElementById('settingsPanel');
document.getElementById('settingsBtn').onclick = () => settingsPanel.classList.toggle('show');

const toggleThemeBtn = document.getElementById('toggleTheme');

const applyTheme = (theme) => {
  if (theme === 'dark') {
    document.body.classList.add('dark');
  } else {
    document.body.classList.remove('dark');
  }
};

const savedTheme = localStorage.getItem('theme');
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

if (savedTheme) {
  applyTheme(savedTheme);
} else if (systemPrefersDark) {
  applyTheme('dark');
}

toggleThemeBtn.onclick = () => {
  const isCurrentlyDark = document.body.classList.contains('dark');
  const newTheme = isCurrentlyDark ? 'light' : 'dark';
  applyTheme(newTheme);
  localStorage.setItem('theme', newTheme);
};
</script>

</html>
